# Static ClimaClue site plus worldwide tiles. Same behaviour as the Cloudflare Pages deploy:
# real 404s (missing ocean tiles must 404, not fall back to index.html).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Soft launch: keep search engines away until the public launch removes this line.
  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml application/octet-stream;
  gzip_min_length 1024;

  error_page 404 /404.html;

  location /squares/ {
    alias /srv/squares/;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/index.html =404;
  }
  location = /healthz { access_log off; return 200 "ok\n"; }
}
